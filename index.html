<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GustSim: local aerodynamic and flow simulation for air and water." />
    <title>GustSim · Aerodynamic simulation</title>
    <script>
      // Apply the saved theme before first paint (no flash). Works offline; storage may be blocked.
      (function () {
        var theme = 'system';
        try { theme = (JSON.parse(localStorage.getItem('gustsim.prefs.v2') || '{}').state || {}).theme || 'system'; } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
