[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gustsim"
version = "0.1.0"
description = "Local engineering CFD workbench"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1", "numpy>=2.1,<3", "trimesh>=4.6,<5", "networkx>=3.4,<4", "h5py>=3.12,<4", "psutil>=6,<8"]

[project.optional-dependencies]
cad = ["cadquery-ocp>=7.8,<7.10"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
gustsim-worker = "gustsim.worker:main"
gustsim = "gustsim.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
gustsim = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
