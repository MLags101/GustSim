# Optional source mounts for Linux or Docker Desktop development.
# docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  api:
    volumes:
      - ./backend:/app/backend:ro
      - ./examples:/app/examples:ro
    environment:
      PYTHONPATH: /app/backend
    command: ["uvicorn", "gustsim.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/backend"]
  worker:
    volumes:
      - ./backend:/app/backend:ro
      - ./examples:/app/examples:ro
      - ./scripts:/app/scripts:ro
    environment:
      PYTHONPATH: /app/backend
  cad:
    volumes:
      - ./backend:/app/backend:ro
    environment:
      PYTHONPATH: /app/backend
  web:
    profiles: ["web"]
    build:
      context: .
      target: web-deps
    working_dir: /app
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      GUSTSIM_API: http://api:8000
      VITE_POLL: "1"
    volumes:
      - ./:/app
      - web-modules:/app/node_modules
volumes:
  web-modules:
